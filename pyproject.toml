[project]
name = "vertisystem-applied-ai-task1"
version = "0.1.0"
description = "Vertisystem Applied AI take-home implementations for the blackjack demo and abacus microservice tasks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "pydantic>=2.8,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.scripts]
applied-ai-blackjack = "applied_ai_blackjack.main:main"
applied-ai-abacus = "applied_ai_abacus.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["applied_ai_blackjack*", "applied_ai_abacus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
